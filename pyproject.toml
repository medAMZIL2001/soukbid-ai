[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "soukbid-ai"
version = "0.1.0"
description = "Intelligent tender analysis and agentic RAG for Moroccan public procurement"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "ruff==0.15.4",
    "pre-commit==4.5.1",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data/raw", "data/processed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
